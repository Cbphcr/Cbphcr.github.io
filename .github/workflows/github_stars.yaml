name: Get GitHub Star Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'

concurrency:
  group: github-star-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Star Counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_github_stars.py
      - name: Commit Star Data
        run: |
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if git diff --quiet -- _data/github_stars.json; then
            echo "No star changes to commit."
            exit 0
          fi
          git add _data/github_stars.json
          git commit -m "Update GitHub star data"
          git push
